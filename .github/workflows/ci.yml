name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # nightly: the full Node 20 + 22 build, so main merges do not pay for it
jobs:
  build:
    # Push to main skips this: the pull request already ran it. Pull requests run Node 22; the nightly run does 20 and 22.
    if: github.event_name != 'push'
    # Set the repository variable RUNS_ON (JSON, e.g. ["ubuntu-latest"]) to change the runner.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    strategy:
      matrix:
        # PRs test the newest Node only; main tests both supported versions.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[20, 22]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run build
  secrets:
    if: github.event_name != 'schedule'
    # Fails the PR if any commit in its history contains a secret.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: PATH="/opt/homebrew/bin:$PATH" gitleaks detect --source . --redact -v

name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted runner, Node 26 only (owner rule 2026-10-31). The mirrored workflow targeted a macOS runner that
    # does not exist in this org, so no check ever ran.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The vendored shared stylesheet must match the hash pinned when it was last re-vendored.
      - run: bash scripts/check-ui-standard.sh
      - run: npm run build
  forbidden-strings:
    # Fails if a tracked file holds a string from the forbidden-strings list (one per line), an unlisted UUID in docs,
    # or an unlisted private hostname. The list comes from the FORBIDDEN_STRINGS repo secret (docs/forbidden-strings.md).
    # With no secret the script exits 1 under CI=true, so this cannot be skipped. Only counts are printed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -n "$FORBIDDEN_STRINGS" ]; then
            printf '%s\n' "$FORBIDDEN_STRINGS" > "$RUNNER_TEMP/forbidden-strings.txt"
            export FORBIDDEN_STRINGS_FILE="$RUNNER_TEMP/forbidden-strings.txt"
          fi
          npm run check:forbidden
      - name: No AI attribution in the tree or recent commits
        run: bash scripts/check-no-ai-attribution.sh
  gitleaks:
    # Fails the PR if any commit in its history contains a secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_8.30.1_checksums.txt"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xz -f gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner -v

  e2e:
    # Playwright 1.58.2 (locked) cannot install browser deps on the ubuntu-latest (26.04) image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check out hostile-mcp (the e2e scans a clean clone of it)
        uses: actions/checkout@v5
        with:
          repository: curtismu7/hostile-mcp-LAB
          path: .e2e/hostile-mcp
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-screenshots
          HOSTILE_MCP_SRC: ${{ github.workspace }}/.e2e/hostile-mcp
      - name: Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            ${{ runner.temp }}/e2e-screenshots
            .data/e2e-screenshots
            e2e-output
          retention-days: 7
